# Infrastructure crates use a stable, revision-pinned tool set.
tasks = ["style", "clippy", "coverage-cfg-clippy", "verify", "strict-doc", "readme", "release-build", "feature-matrix", "project-hook", "package", "coverage", "audit"]

[local]
hook = "project-ci-check.sh"
matrix = ".infra/ci/cargo-matrix.json"
fuzz_version = "0.13.2"
fuzz_max_len = 4096
fuzz_seconds_per_target = 10
fuzz_mode = "smoke"
build_toolchain = "1.94.0"
clippy_toolchain = "nightly-2026-06-05"
nightly_toolchain = "nightly-2026-06-05"
coverage_cfg_clippy = false
audit_cached_fallback = false
