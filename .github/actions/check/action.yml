name: Rust dependency policy check
description: Install rs-infra-dependency from this action and check a Rust project
inputs:
  project:
    description: Path to the Rust project to check
    required: false
    default: .
  token:
    description: Optional GitHub token used when fetching a private baseline repository
    required: false
  toolchain:
    description: Rust toolchain used to build the policy checker
    required: false
    default: stable
runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
    - name: Install dependency policy checker
      shell: bash
      env:
        CARGO_NET_GIT_FETCH_WITH_CLI: true
      # The composite action lives below the Cargo package root.
      run: cargo install --path "${{ github.action_path }}/../../.." --bin rs-infra-dependency --locked --force
    - name: Check dependency policy
      shell: bash
      env:
        POLICY_GIT_TOKEN: ${{ inputs.token }}
        CARGO_NET_GIT_FETCH_WITH_CLI: true
      run: |
        if [[ -n "$POLICY_GIT_TOKEN" ]]; then
          git config --global url."https://x-access-token:${POLICY_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
        fi
        rs-infra-dependency --project "${{ inputs.project }}" check --temporary-lockfile
